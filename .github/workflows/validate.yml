name: Validate MyMatchIQ build

on:
  push:
    branches:
      - migration/neon-cloudflare-20260906
      - build/complete-mymatchiq-20260906
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
