name: Deploy MyMatchIQ to Cloudflare

on:
  push:
    branches:
      - build/complete-mymatchiq-20260906
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_NEON_AUTH_URL: https://ep-super-tree-artr2fjt.neonauth.c-4.us-west-2.aws.neon.tech/neondb/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Deploy visual review build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name mymatchiq-review
