name: Audit MyMatchIQ dependencies

on:
  push:
    branches:
      - build/complete-mymatchiq-20260906
    paths:
      - automation/security-audit.trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Report production dependency vulnerabilities
        run: npm audit --omit=dev || true
